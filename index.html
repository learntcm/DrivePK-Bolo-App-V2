<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DrivePK Bolo V2 Native Search</title>
  <meta name="description" content="DrivePK Bolo V2 with real vehicle search API and native-style UI." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <noscript><div class="noscript">This app needs JavaScript enabled.</div></noscript>

  <div class="app-frame">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">D</div>
        <strong>DrivePK</strong>
      </div>
      <button class="used-pill" type="button">Used Vehicles</button>
    </header>

    <main class="screen active" id="homeScreen">
      <section class="search-hero">
        <div class="search-box">
          <span>🔍</span>
          <input id="homeSearchInput" type="search" placeholder="Search Car" />
        </div>
        <button class="filter-btn" id="openSearchBtn" type="button">☰</button>
      </section>

      <section class="category-grid">
        <button data-body="Hatchback"><span>Hatchback</span><div class="car-silhouette">▰</div></button>
        <button data-category="Premium"><span>Premium</span><div class="car-silhouette">▰</div></button>
        <button data-body="SUV"><span>SUV</span><div class="car-silhouette">▰</div></button>
        <button data-body="Sedan"><span>Sedan</span><div class="car-silhouette">▰</div></button>
        <button data-body="Sports"><span>Sports</span><div class="car-silhouette">▰</div></button>
        <button data-fuel="Electric"><span>Electric</span><div class="car-silhouette">▰</div></button>
      </section>

      <section class="section-head">
        <h2>Featured Pro</h2>
        <button id="viewAllBtn" type="button">View All ❯</button>
      </section>

      <section class="featured-strip" id="featuredStrip">
        <div class="loading-card">Loading cars...</div>
      </section>

      <section class="section-head">
        <h2>Latest Listings</h2>
      </section>

      <section class="listing-list" id="latestList">
        <div class="loading-card">Loading listings...</div>
      </section>
    </main>

    <main class="screen" id="listingScreen">
      <header class="subbar">
        <button id="backHomeBtn" type="button">←</button>
        <h1>Vehicle Listing</h1>
        <button id="sortBtn" type="button">↕</button>
      </header>

      <section class="search-hero compact">
        <div class="search-box">
          <span>🔍</span>
          <input id="listingSearchInput" type="search" placeholder="Search Toyota Lahore 2020..." />
        </div>
        <button class="filter-btn" id="voiceSearchBtn" type="button" aria-label="Voice search">🎙</button>
      </section>

      <div class="quick-filters">
        <input id="brandInput" placeholder="Brand" />
        <input id="modelInput" placeholder="Model" />
        <input id="cityInput" placeholder="City" />
        <input id="minPriceInput" inputmode="numeric" placeholder="Min Price" />
        <input id="maxPriceInput" inputmode="numeric" placeholder="Max Price" />
        <input id="yearInput" inputmode="numeric" placeholder="Year" />
      </div>

      <button class="primary-wide" id="runSearchBtn" type="button">Search Vehicles</button>

      <div class="voice-status" id="voiceStatus"></div>
      <section class="listing-list full" id="searchResultsList">
        <div class="empty-state">Search results will appear here.</div>
      </section>
    </main>

    <main class="screen" id="postScreen">
      <header class="subbar">
        <button id="backFromPostBtn" type="button">←</button>
        <h1>Post Vehicle</h1>
        <button type="button">⋮</button>
      </header>

      <section class="post-card">
        <h2>Voice Post Demo</h2>
        <p>Database is untouched. This keeps the current browser demo post flow for testing.</p>
        <button class="primary-wide" id="postVoiceBtn" type="button">🎙 Start Recording</button>
        <button class="secondary-wide" id="resetPostBtn" type="button">Reset Form</button>
        <div class="voice-status" id="postStatus">Ready to record</div>
      </section>

      <section class="post-form">
        <label>Make / Company<input id="vehicleMake" placeholder="Toyota" /></label>
        <label>Model<input id="vehicleModel" placeholder="Hiace" /></label>
        <label>Year<input id="vehicleYear" inputmode="numeric" placeholder="1986" /></label>
        <label>Price PKR<input id="vehiclePrice" inputmode="numeric" placeholder="3200000" /></label>
        <label>City<input id="vehicleCity" placeholder="Rawalpindi" /></label>
        <label>Color<input id="vehicleColor" placeholder="White" /></label>
        <label>Registered In<input id="vehicleRegisteredIn" placeholder="Islamabad" /></label>
        <label>Mileage KM<input id="vehicleMileage" inputmode="numeric" placeholder="45000" /></label>
        <label>Additional Details<textarea id="vehicleExtraInfo" placeholder="Condition, variant, features, documents, etc."></textarea></label>
        <button class="primary-wide" id="saveLocalPostBtn" type="button">Save Demo Post</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="tab active" data-target="homeScreen">⌂<span>Home</span></button>
      <button class="tab" data-target="listingScreen">▤<span>Cars</span></button>
      <button class="mic-tab" data-target="postScreen" aria-label="Post vehicle by voice">🎙</button>
      <button class="tab" data-target="listingScreen">🔍<span>Search</span></button>
      <button class="tab" data-target="homeScreen">👤<span>Profile</span></button>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
